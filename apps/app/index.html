<!doctype html>
<html lang="es-CR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFBF2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141917" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Sin precarga de fuentes: font-display swap con respaldo de métricas ajustadas (CLS 0) y, precargadas, le quitaban
         ancho de banda a la portada de la ficha en Slow 4G (LCP 2,4 s → 1,9 s en Lighthouse; ticket 12). -->
    <!--app-head--><title>bnbtico</title><!--/app-head-->
    <script type="module" src="/src/client/main.tsx"></script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <!-- Solo en vertical (decisión 2026-11-03): en un teléfono en horizontal, global.css enseña este aviso y esconde lo demás
         (visibility, sin desmontar: al volver a vertical la app sigue donde estaba). Fuera de #root: React no lo toca. -->
    <div class="rotate-notice" role="alert">
      <img src="/logo-horizontal.png" alt="" width="115" height="38" loading="lazy" decoding="async" />
      <p>Gire el teléfono para usar bnbtico</p>
    </div>
  </body>
</html>

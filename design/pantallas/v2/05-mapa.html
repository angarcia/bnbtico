<style>
body{margin:0;background:#EFE6D3;font-family:'Figtree',ui-sans-serif,system-ui,sans-serif;color:#1C2B2A}
.wrap{display:flex;flex-wrap:wrap;gap:40px;justify-content:center;align-items:flex-start;padding:32px 16px}
figure{margin:0;display:flex;flex-direction:column;gap:10px}
figcaption{font-size:13px;font-weight:600;color:#5C6B69;max-width:390px}
.ab{position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:#FFFBF2;color:#1C2B2A;font-family:'Figtree',ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.4}
.ab *{box-sizing:border-box}
.ab h1,.ab h2,.ab h3,.ab p{margin:0}
.o{font-family:'Outfit',ui-sans-serif,system-ui,sans-serif;letter-spacing:-0.02em}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.mut{color:#5C6B69}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cur{display:inline-flex;padding:3px;gap:2px;border-radius:999px;background:#F6E7C8;flex:none}
.cur span{min-width:40px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:999px;font-weight:700;font-size:16px;color:#5C6B69}
.cur span.on{background:#7FA98A;color:#16331F}
.cur.ov{background:#FFFBF2}
.topbar{position:absolute;left:0;right:0;top:8px;height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#FFFBF2;z-index:4}
.topbar img{height:34px;width:auto}
.avatar{width:44px;height:44px;border-radius:999px;background:#DCE8DF;color:#2F5D45;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-weight:700;font-size:16px;text-decoration:none;flex:none}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;padding:8px 6px 20px;display:flex;align-items:center;background:#FFFBF2;border-top:2px solid #EADFC8;z-index:6}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5C6B69;font-size:11px;font-weight:600;text-decoration:none;white-space:nowrap}
.tab svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#B44C30;font-weight:700}.tab.on svg{stroke-width:2.4}
.badge{position:absolute;top:-6px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#B44C30;color:#FFFBF2;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #FFFBF2}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;border:0;font-family:inherit;white-space:nowrap;cursor:pointer}
.btn.fill{background:#2F5D45;color:#FFFBF2}
.btn.line{border:1.5px solid #2F5D45;color:#2F5D45;background:transparent}
.btn.sun{background:#F2B544;color:#1C2B2A}
.btn.ghost{background:transparent;color:#5C6B69;text-decoration:underline;text-underline-offset:3px;padding:0 8px}
.btn.wa{background:#25D366;color:#063B1E;border-radius:18px;font-family:'Outfit',sans-serif;font-weight:800;font-size:16px;min-height:56px}
.state{position:absolute;left:12px;top:12px;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;line-height:1;box-shadow:0 2px 10px rgba(28,43,42,.22)}
.state::before{content:"";width:8px;height:8px;border-radius:999px;background:currentColor}
.st-ok{background:#DCE8DF;color:#2F5D45}.st-draft{background:#F6E7C8;color:#1C2B2A}.st-rev{background:#F0E6D2;color:#5C6B69}.st-pay{background:#FBE8C2;color:#7A4E07}.st-off{background:#F6E7C8;color:#5C6B69}
.card{background:#FFFFFF;border-radius:24px;box-shadow:0 2px 0 #E6DCC6}
.tag-rev{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:#F0E6D2;color:#5C6B69;font-size:11px;font-weight:700;line-height:1.5;white-space:nowrap}
.pin{position:absolute;transform:translate(-50%,-50%);padding:6px 10px;border-radius:999px;background:#FFFFFF;color:#1C2B2A;font-weight:700;font-size:13px;line-height:1.2;box-shadow:0 2px 0 #E6DCC6,0 6px 14px -6px rgba(28,43,42,.5);white-space:nowrap;font-variant-numeric:tabular-nums}
.pin.on{background:#B44C30;color:#FFFBF2;z-index:2;box-shadow:0 6px 14px -4px rgba(180,76,48,.6)}
.photo{position:relative;overflow:hidden;background:#DCE8DF}
.photo>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.heart{position:absolute;right:8px;top:8px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 1px 3px rgba(28,43,42,.45))}
.dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:999px;background:rgba(255,251,242,.6)}.dots i.on{background:#FFFBF2}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:12px;font-weight:700;color:#5C6B69;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px;font-variant-numeric:tabular-nums}
.cal .d{height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}
.cal .rg{background:#F8E1D8}
.cal .rs{background:linear-gradient(90deg,transparent 50%,#F8E1D8 50%)}
.cal .re{background:linear-gradient(90deg,#F8E1D8 50%,transparent 50%)}
.cal .rs b,.cal .re b,.cal .one b{width:42px;height:42px;border-radius:999px;background:#B44C30;color:#FFFBF2;display:flex;align-items:center;justify-content:center;font-weight:700}
.sbar{position:absolute;left:0;right:0;bottom:0;height:92px;padding:12px 16px 28px;display:flex;align-items:center;justify-content:space-between;background:#FFFBF2;border-top:2px solid #EADFC8;z-index:5}
.fold{display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 20px;border-radius:20px;background:#FFFFFF;box-shadow:0 2px 0 #E6DCC6;text-decoration:none;color:#1C2B2A}
.fold span{color:#5C6B69;font-size:14px;font-weight:600}.fold b{font-weight:700;font-size:15px}
.big{border-radius:28px;background:#FFFFFF;box-shadow:0 2px 0 #E6DCC6,0 16px 36px -22px rgba(28,43,42,.45);padding:20px}
.xbtn{position:absolute;left:16px;top:12px;width:44px;height:44px;border-radius:999px;background:#FFFFFF;border:1.5px solid #E6DCC6;display:flex;align-items:center;justify-content:center;color:#1C2B2A;text-decoration:none}
</style>

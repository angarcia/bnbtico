figcaption{font-size:13px;font-weight:600;color:#5C6B69;max-width:390px}

.ab h1,.ab h2,.ab h3,.ab p{margin:0}

.cur{display:inline-flex;padding:3px;gap:2px;border-radius:999px;background:#F6E7C8;flex:none}
.cur span{min-width:40px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:999px;font-weight:700;font-size:16px;color:#5C6B69}
.cur span.on{background:#7FA98A;color:#16331F}

.topbar{position:absolute;left:0;right:0;top:56px;height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#FFFBF2;z-index:4}

.avatar{width:44px;height:44px;border-radius:999px;background:#DCE8DF;color:#2F5D45;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-weight:700;font-size:16px;text-decoration:none;flex:none}

.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5C6B69;font-size:11px;font-weight:600;text-decoration:none;white-space:nowrap}
.tab svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#BF4D2E;font-weight:700}.tab.on svg{stroke-width:2.4}

.btn.sun{background:#F2B544;color:#1C2B2A}
.btn.ghost{background:transparent;color:#5C6B69;text-decoration:underline;text-underline-offset:3px;padding:0 8px}

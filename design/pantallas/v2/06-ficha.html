<style>
body{margin:0;background:#EFE6D3;font-family:'Figtree',ui-sans-serif,system-ui,sans-serif;color:#1C2B2A}
.wrap{display:flex;flex-wrap:wrap;gap:40px;justify-content:center;align-items:flex-start;padding:32px 16px}
figure{margin:0;display:flex;flex-direction:column;gap:10px}
figcaption{font-size:13px;font-weight:600;color:#5C6B69;max-width:390px}
.ab{position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:#FFFBF2;color:#1C2B2A;font-family:'Figtree',ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.4}
.ab *{box-sizing:border-box}
.ab h1,.ab h2,.ab h3,.ab p{margin:0}
.o{font-family:'Outfit',ui-sans-serif,system-ui,sans-serif;letter-spacing:-0.02em}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.mut{color:#5C6B69}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cur{display:inline-flex;padding:3px;gap:2px;border-radius:999px;background:#F6E7C8;flex:none}
.cur span{min-width:40px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:999px;font-weight:700;font-size:16px;color:#5C6B69}
.cur span.on{background:#7FA98A;color:#16331F}

.topbar{position:absolute;left:0;right:0;top:56px;height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#FFFBF2;z-index:4}

.avatar{width:44px;height:44px;border-radius:999px;background:#DCE8DF;color:#2F5D45;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-weight:700;font-size:16px;text-decoration:none;flex:none}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;padding:8px 6px 20px;display:flex;align-items:center;background:#FFFBF2;border-top:2px solid #EADFC8;z-index:6}

.tab svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#B44C30;font-weight:700}.tab.on svg{stroke-width:2.4}

.btn.line{border:1.5px solid #2F5D45;color:#2F5D45;background:transparent}
.btn.sun{background:#F2B544;color:#1C2B2A}
.btn.ghost{background:transparent;color:#5C6B69;text-decoration:underline;text-underline-offset:3px;padding:0 8px}

.photo{position:relative;overflow:hidden;background:#DCE8DF}
.photo>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.heart{position:absolute;right:8px;top:8px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 1px 3px rgba(28,43,42,.45))}

.dots i{width:7px;height:7px;border-radius:999px;background:rgba(255,251,242,.6)}.dots i.on{background:#FFFBF2}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:12px;font-weight:700;color:#5C6B69;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px;font-variant-numeric:tabular-nums}
.cal .d{height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}
.cal .rg{background:#F8E1D8}
.cal .rs{background:linear-gradient(90deg,transparent 50%,#F8E1D8 50%)}
.cal .re{background:linear-gradient(90deg,#F8E1D8 50%,transparent 50%)}

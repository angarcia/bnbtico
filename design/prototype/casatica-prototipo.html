<meta charset="utf-8">
<title>bnbtico Prototipo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: prototype shell (role tabs + device toggle) wrapping one responsive app surface.
   Phone = 390px frame with bottom tabs; Web = wide surface with top nav. Same screens, container queries. */
:root{
  --bg:#F7F5EF;          /* ground: warm paper */
  --surface:#FFFFFF;
  --surface-2:#EFEDE6;
  --fg:#1B2420;
  --muted:#5F6B64;
  --line:#DDD9CE;
  --coral:#FF385C;       /* bnbtico: original coral logo */
  --primary:#D92349;     /* deeper coral for white text contrast */
  --primary-ink:#A81736;
  --primary-soft:#FFF0F3;
  --primary-on:#FFFFFF;
  --success-soft:#DCEFE4;--success-ink:#124634;
  --sun:#E8A33D;         /* accent: sol de Guanacaste, used sparingly */
  --sun-soft:#FBEFD9;
  --sun-ink:#7A4E07;
  --wa:#25D366;          /* WhatsApp brand green, CTA only */
  --wa-ink:#0B7A3B;
  --ok:#2E8B57; --warn:#C97A12; --bad:#C2432F; --bad-soft:#FBE3DF;
  --note-fg:#5B3A05; --note-line:#F0D7A8;
  --shadow:0 1px 2px rgba(27,36,32,.06),0 8px 24px -12px rgba(27,36,32,.18);
  --r:14px;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Nunito Sans",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917;--surface:#1C2320;--surface-2:#242D29;--fg:#EDEFEA;--muted:#A3ADA6;--line:#2F3934;
  --primary:#FF8097;--primary-ink:#FFADC0;--primary-soft:#44232D;--primary-on:#35101A;--success-soft:#1E3A2D;--success-ink:#8FD3B0;--sun:#F0B24F;--sun-soft:#3B2E17;--sun-ink:#F3D6A1;
  --wa:#25D366;--wa-ink:#7BE3A6;--bad-soft:#4A2521;--note-fg:#F3D6A1;--note-line:#5a4318;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917;--surface:#1C2320;--surface-2:#242D29;--fg:#EDEFEA;--muted:#A3ADA6;--line:#2F3934;
  --primary:#FF8097;--primary-ink:#FFADC0;--primary-soft:#44232D;--primary-on:#35101A;--success-soft:#1E3A2D;--success-ink:#8FD3B0;--sun:#F0B24F;--sun-soft:#3B2E17;--sun-ink:#F3D6A1;
  --wa:#25D366;--wa-ink:#7BE3A6;--bad-soft:#4A2521;--note-fg:#F3D6A1;--note-line:#5a4318;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;padding-inline:16px;padding-block:16px 40px}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- Prototype shell ---------- */
.shell{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.shell-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em}
/* Display only the selected frog lockup from the unmodified original sheet.
   Source 1716×917; selected region x=195, y=510, w=1360, h=355. */
.brand-logo{display:block;position:relative;width:174px;aspect-ratio:1360/355;overflow:hidden;flex:none;background:#fff;border-radius:4px}
.brand-logo img{position:absolute;width:126.176471%;max-width:none;height:auto;left:-14.338235%;top:-143.661972%}
.mobile-brand{display:flex;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.mobile-brand .brand-logo{width:140px}
.brand small{font-family:var(--body);font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-left:4px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.shell-note{font-size:13px;color:var(--muted);max-width:68ch}
.stage{display:flex;justify-content:center;align-items:flex-start}
.screen{container-type:inline-size;background:var(--bg);position:relative;overflow:hidden}
.stage.phone .screen{width:390px;max-width:100%;height:800px;border-radius:40px;border:10px solid #1b1f1d;box-shadow:0 30px 60px -30px rgba(0,0,0,.5);display:flex;flex-direction:column}
.stage.web .screen{width:100%;min-height:760px;border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column}
.statusbar{display:none}
.stage.phone .statusbar{display:flex;justify-content:space-between;font-size:12px;font-weight:700;padding:10px 22px 0;color:var(--fg)}
.app{flex:1;display:flex;flex-direction:column;min-height:0}
.view{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin}
@container (min-width:800px){.view{padding:24px 32px 40px;gap:20px}}

/* top nav (web) / bottom tabs (phone) */
.topnav{display:none}
.tabs{display:flex;justify-content:space-around;border-top:1px solid var(--line);background:var(--surface);padding:8px 6px 10px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 10px;border-radius:10px}
.tabs button[aria-current="page"]{color:var(--primary)}
.tabs svg{width:22px;height:22px}
.tabs.owner-tabs button{flex:1;min-width:0;min-height:48px;padding:4px 1px;font-size:10px;line-height:1.15;text-align:center;position:relative}
.nav-count{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;border-radius:20px;background:var(--primary);color:white;font-size:10px;padding:0 3px}
.owner-tabs .nav-count{position:absolute;top:0;right:3px}
@container (min-width:800px){
  .mobile-brand{display:none}
  .tabs{display:none}
  .topnav{display:flex;align-items:center;gap:22px;padding:14px 32px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
  .topnav .brand{margin-right:auto}
  .topnav button.nav{font-weight:700;color:var(--muted);padding:6px 2px;border-bottom:2px solid transparent}
  .topnav button.nav[aria-current="page"]{color:var(--fg);border-color:var(--primary)}
}

/* ---------- Primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid transparent;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:var(--primary-on)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--fg)}
.btn-wa{background:var(--wa);color:#063b1e;font-size:15px;padding:14px 18px;width:100%}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn-link{color:var(--primary);padding:0 4px;text-decoration:underline;font-weight:700}
.btn-danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-on)}
.chiprow{display:flex;flex-shrink:0;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
@container (min-width:800px){.chiprow{margin-inline:0;padding-inline:0;flex-wrap:wrap;overflow:visible}}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.badge-ok{background:var(--success-soft);color:var(--success-ink)}
.badge-sun{background:var(--sun-soft);color:var(--sun-ink)}
.badge-warn{background:var(--sun-soft);color:var(--warn)}
.badge-bad{background:var(--bad-soft);color:var(--bad)}
.badge-mute{background:var(--surface-2);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:8px;min-width:0}
.grid{display:grid;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:700}
.field input,.field select,.field textarea{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);width:100%}
.field .hint{font-size:12px;color:var(--muted)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 14px;box-shadow:var(--shadow)}
.search input{border:0;background:none;flex:1;min-width:0;font-size:15px}
.search input:focus{outline:none}
.search svg{width:20px;height:20px;flex:none;color:var(--muted)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.divider{height:1px;background:var(--line)}
.sheet{position:absolute;inset:0;background:rgba(10,14,12,.45);display:flex;align-items:flex-end;z-index:20}
.sheet-body{background:var(--surface);width:100%;border-radius:22px 22px 0 0;padding:16px 16px 18px;display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto}
.stage.web .sheet{position:fixed;align-items:center;justify-content:center;padding:16px}
.stage.web .sheet-body{max-width:520px;max-height:90vh;border-radius:20px}
@container (min-width:800px){.sheet{align-items:center;justify-content:center}.sheet-body{width:520px;border-radius:20px;padding:24px}}
.note{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--sun-soft);color:var(--note-fg);font-size:13px;border:1px solid var(--note-line)}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:30;box-shadow:var(--shadow);white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.wa-bubble{background:#E7FFDB;color:#1b2420;border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:14px;max-width:48ch}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details p{padding-top:6px}

/* photos: generated placeholders */
.photo{position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2);aspect-ratio:4/3;max-width:100%}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 50%,rgba(0,0,0,.35))}
.photo span{position:absolute;left:10px;bottom:8px;color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;z-index:1;opacity:.85}
.p-playa{background:linear-gradient(160deg,#7fcde0 0%,#2b8db0 45%,#e5cf9a 46%,#d2b77c 100%)}
.p-selva{background:linear-gradient(160deg,#9bd27f 0%,#2f7a3a 55%,#1d4d28 100%)}
.p-montana{background:linear-gradient(160deg,#cfe3ee 0%,#6f9aa8 40%,#3c5d4a 41%,#24402f 100%)}
.p-ciudad{background:linear-gradient(160deg,#e9e1d4 0%,#b7a890 50%,#6d6a62 100%)}
.p-volcan{background:linear-gradient(160deg,#f0c08a 0%,#b56a3c 45%,#3d4a3a 46%,#223226 100%)}
.p-caribe{background:linear-gradient(160deg,#5fd3c9 0%,#1f8f98 50%,#2f6a3b 51%,#17442a 100%)}
.p-piscina{background:linear-gradient(160deg,#8fdcf0 0%,#3aa6cc 50%,#c7c2ad 51%,#8e8a78 100%)}

/* listing cards */
.listing{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.listing .photo{border-radius:0;aspect-ratio:16/11}
.listing .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.listing .fav{position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#1b2420}
.listing .fav svg{width:18px;height:18px}
.listing .fav[aria-pressed="true"]{color:var(--bad)}
.listing .price{font-weight:800;font-size:16px}
.listing .price small{font-weight:600;color:var(--muted);font-size:12px}
.listings{display:grid;gap:14px;grid-template-columns:1fr}
@container (min-width:640px){.listings{grid-template-columns:repeat(2,1fr)}}
@container (min-width:1000px){.listings{grid-template-columns:repeat(3,1fr)}}

/* map */
.map{position:relative;border-radius:16px;overflow:hidden;background:
  radial-gradient(circle at 30% 40%,#cfe6d2 0,transparent 35%),
  radial-gradient(circle at 70% 60%,#d9ead6 0,transparent 40%),
  repeating-linear-gradient(0deg,transparent 0 23px,rgba(0,0,0,.05) 23px 24px),
  repeating-linear-gradient(90deg,transparent 0 23px,rgba(0,0,0,.05) 23px 24px),#e4ecdf;min-height:220px;border:1px solid var(--line)}
.map .water{position:absolute;inset:0;background:linear-gradient(200deg,transparent 55%,#bcd9e6 56%),linear-gradient(20deg,transparent 70%,#bcd9e6 71%)}
.pin{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#1b2420;border:1px solid #cfd6cc;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800;box-shadow:var(--shadow);cursor:pointer;white-space:nowrap}
.pin.active{background:var(--primary);color:var(--primary-on);border-color:var(--primary)}
.map .tag{position:absolute;left:10px;top:10px;background:#fff;color:#5F6B64}
.home-layout{display:flex;flex-direction:column;gap:14px}
@container (min-width:1000px){.home-layout{display:grid;grid-template-columns:1fr 420px;align-items:start}.home-layout .map{position:sticky;top:0;min-height:560px}}

/* gallery (detail) */
.gallery{display:grid;grid-template-columns:1fr;gap:6px}
.gallery .photo:not(:first-child){display:none}
@container (min-width:800px){.gallery{grid-template-columns:2fr 1fr 1fr;grid-template-rows:200px 200px}.gallery .photo{display:block;aspect-ratio:auto;height:100%}.gallery .photo:first-child{grid-row:span 2}}
.detail-layout{display:flex;flex-direction:column;gap:16px}
@container (min-width:800px){.detail-layout{display:grid;grid-template-columns:1fr 360px;gap:32px;align-items:start}.detail-side{position:sticky;top:0}}
.amen{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@container (min-width:800px){.amen{grid-template-columns:repeat(3,1fr)}}
.amen div{display:flex;gap:8px;align-items:center;font-size:14px}
.cta-bar{position:sticky;bottom:-24px;margin:0 -16px -24px;padding:10px 16px 12px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center}
@container (min-width:800px){.cta-bar{display:none}}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:12px;text-align:center}
.cal .dow{font-weight:700;color:var(--muted);font-size:11px;padding:4px 0}
.cal .d{padding:6px 2px;border-radius:8px;background:var(--surface-2);min-height:40px;display:flex;flex-direction:column;justify-content:center;gap:1px;cursor:pointer}
.cal .d small{font-size:10px;color:var(--muted)}
.cal .d.busy{background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 7px);color:var(--muted)}
.cal .d.hi{background:var(--sun-soft);color:var(--sun-ink)}
.cal .d.hi small{color:var(--sun-ink)}
.cal .d.empty{background:transparent;cursor:default}
.legend{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@container (min-width:800px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat .v{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .k{font-size:12px;color:var(--muted);font-weight:700}
.stat .t{font-size:12px;font-weight:700}
.up{color:var(--ok)}.down{color:var(--bad)}
.spark{height:36px;width:100%;display:block}

/* wizard */
.steps{display:flex;gap:6px}
.steps span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps span.on{background:var(--primary)}
.opt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:2px}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt b{font-size:14px}.opt span{font-size:12px;color:var(--muted)}
.upload{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:13px;background:var(--surface)}
.photos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.summary-box{background:var(--primary-soft);border-color:transparent}

/* lists */
.list{display:flex;flex-direction:column}
.list > *{padding:12px 0;border-bottom:1px solid var(--line)}
.list > *:last-child{border-bottom:0}
.lead{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.score{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13px}
.ratebtn{display:flex;gap:4px}
.ratebtn button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);font-size:15px;color:var(--line)}
.ratebtn button.on{color:var(--sun);border-color:var(--sun)}

/* landing */
.hero{display:grid;gap:18px;padding:8px 0}
@container (min-width:800px){.hero{grid-template-columns:1.1fr 1fr;align-items:center;gap:40px;padding:30px 0}}
.hero h1{font-size:32px;font-weight:800;letter-spacing:-.02em}
@container (min-width:800px){.hero h1{font-size:50px}}
.hero p{font-size:16px;color:var(--muted);max-width:52ch}
.price-box{background:var(--primary);color:var(--primary-on);border-radius:20px;padding:22px}
.price-box .big{font-family:var(--display);font-size:40px;font-weight:800;letter-spacing:-.02em}
.price-box .eyebrow{color:#CDE8D8}
.btn-onprimary{background:var(--surface);color:var(--primary-ink);align-self:flex-start}
.how{display:grid;gap:12px}
@container (min-width:800px){.how{grid-template-columns:repeat(3,1fr)}}
.how .card b{font-family:var(--display);font-size:17px}
.compare{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
.compare th,.compare td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
.compare tr:last-child td{border-bottom:0}
.compare th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.compare td:first-child{font-weight:700}
.tbl-wrap{overflow-x:auto}

/* admin */
.queue{display:grid;gap:12px}
@container (min-width:800px){.queue{grid-template-columns:repeat(2,1fr)}}
.doc{aspect-ratio:1.6;border-radius:10px;background:repeating-linear-gradient(0deg,var(--surface-2) 0 10px,var(--surface) 10px 14px);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);font-weight:700}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.search-paths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:22px}
.search-path{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);border-top:3px solid #FF385C}
.assisted-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;margin-bottom:24px;align-items:start}
.assist-history{display:flex;flex-direction:column;gap:10px;max-height:250px;overflow:auto}
.assist-history:empty{display:none}
.assist-bubble{border-radius:16px;padding:12px;background:#F7F5EF;max-width:90%;overflow-wrap:anywhere}
.assist-user{align-self:flex-end;background:#FFE7EC}
.assist-summary{position:sticky;top:12px}
.phone .assisted-layout{grid-template-columns:1fr}
.phone .search-paths{gap:8px}
.phone .search-path{padding:12px}

function moderateListing(index,status,reason=''){
 const q=S.queue[index];
 if(S.role!=="admin"||!q||!q.reviewOpened||q.status!=="pend"||!["ok","no","changes"].includes(status))return false;
 const note=String(reason).trim();
 if(note.length>2000||(status!=="ok"&&!note)||(status==="ok"&&(q.identityStatus!=="approved"||!q.listing||q.listing.photoCount<5)))return false;
 q.status=status;q.decision={status,reason:note,at:new Date().toISOString()};
 q.listing.status={ok:'approved-demo',no:'rejected',changes:'changes-requested'}[status];return true;
}

 if(!t)return;const d=t.dataset;
 if(d.rmode){S.req.mode=d.rmode;S.req.dates=d.rmode==="vac"?"20–23 nov":"desde feb 2027";render();return}
 if(d.rppl){S.req.ppl=Math.max(1,S.req.ppl+Number(d.rppl));render();return}
 if(d.need){S.req.needs.has(d.need)?S.req.needs.delete(d.need):S.req.needs.add(d.need);render();return}
 if(d.sendRequest!==undefined){if(!document.getElementById('r-consent').checked){toast('Aceptá recibir propuestas antes de enviar');return}if(!S.loggedIn){S.params={after:"request"};S.screen="login";render();return}if(!submitHouseRequest(true)){toast('Revisá fechas, coincidencias y el máximo de 3 solicitudes activas');return}go("my-requests");toast('Solicitud guardada · envío simulado, sin avisos reales');return}
 if(d.replyReq!==undefined){S.sheet={type:"reply",i:Number(d.replyReq)};render();return}
 if(d.role){setRole(d.role);return}
 if(d.roleSwitch){setRole(d.roleSwitch);return}
 if(d.dev){S.dev=d.dev;render();return}
 if(d.fav!==undefined){e.stopPropagation();S.favs.has(d.fav)?S.favs.delete(d.fav):S.favs.add(d.fav);render();return}
 if(d.open){go("detail",{id:d.open});return}
 if(d.go){go(d.go,d.id?{id:d.id}:{});return}
 if(d.mode){S.mode=d.mode;S.filters.prov="Todas";render();return}
 if(d.prov){S.filters.prov=d.prov;render();return}
 if(d.provStay){S.filters.prov=d.provStay;render();return}
 if(d.tog){S.filters[d.tog]=!S.filters[d.tog];render();return}
 if(d.clear!==undefined){S.filters={prov:"Todas",ppl:0,beds:0,pool:false,pets:false,ac:false,wifi:false,ev:false};render();return}
 if(d.contact){relayOpenHouse(d.contact);return}
 if(d.login!==undefined){S.loggedIn=true;const id=S.params.id;if(S.params.after==="offer"&&id){relayOpenOffer(id,S.params.thread)}else if(S.params.after==="contact"&&id){relayOpenHouse(id)}else if(S.params.after==="request"){go("request")}else go("profile");toast("Demo: sesión con identidad verificada simulada");return}
 if(d.closeBtn!==undefined||(d.close!==undefined&&e.target===t)){S.sheet=null;render();return}
 if(d.toast){S.sheet=null;toast(d.toast);return}
 if(d.wiz){S.wizStep=Math.min(5,Math.max(1,S.wizStep+Number(d.wiz)));render();document.querySelector(".view").scrollTop=0;return}
 if(d.wtype){S.wizType=d.wtype;render();return}
 if(d.submitHouse!==undefined){S.wizStep=1;go("o-houses");toast("Enviada a revisión · te avisamos en menos de 24 h");return}
 if(d.rate){const [i,n]=d.rate.split(":").map(Number);S.leads[i].rated=n;render();return}
 if(d.approve!==undefined){if(moderateListing(Number(d.approve),"ok"))toast("Anuncio aprobado · demo sin publicación real");return}
 if(d.reject!==undefined){if(moderateListing(Number(d.reject),"no"))toast("Anuncio rechazado · demo sin avisos reales");return}
 if(d.day){t.classList.toggle("busy");return}
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset.sel){S.filters[t.dataset.sel]=Number(t.value);render();return}
 if(t.dataset.rzone!==undefined){S.req.zone=t.value;return}
 if(t.dataset.rtext!==undefined){S.req.text=t.value;
  /* detección simple de requisitos en el texto */
  const txt=t.value.toLowerCase();const map={"piscina":"Piscina","cargador":"Cargador eléctrico","eléctrico":"Cargador eléctrico","electrico":"Cargador eléctrico","perro":"Mascotas","gato":"Mascotas","mascota":"Mascotas","aire":"Aire acondicionado","wifi":"Wifi","playa":"Frente al mar","cochera":"Cochera","amueblad":"Amueblado"};
  let added=false;Object.entries(map).forEach(([k,v])=>{if(txt.includes(k)&&!S.req.needs.has(v)){S.req.needs.add(v);added=true}});
  const n=txt.match(/somos\s+(\d+)/);if(n){S.req.ppl=Number(n[1]);added=true}
  if(added){render();toast("Detectamos requisitos en tu texto")}
  return}
});
render();

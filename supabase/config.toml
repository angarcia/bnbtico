# Supabase CLI · proyecto local. `supabase start` requiere Docker.
project_id = "bnbtico"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
max_rows = 200

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://pruebas.bnbtico.com", "https://bnbtico.com"]
enable_signup = true

[auth.sms]
# Fase 1: códigos por WhatsApp con Twilio Verify (canal whatsapp). Variables en .env, nunca aquí.
enable_signup = true
enable_confirmations = true
# Solo local: en el proyecto alojado se deja el valor por defecto (60 s entre códigos al mismo número).
# La app ya impone 30 s y, si Supabase responde con su límite, muestra los segundos que faltan.
max_frequency = "1s"

# Proveedor local de relleno: GoTrue rechaza cualquier código sin un proveedor activo, aunque el número sea de prueba.
# No son credenciales reales; las del proyecto alojado se configuran en el panel (Authentication → Providers → Phone).
[auth.sms.twilio_verify]
enabled = true
account_sid = "local-sin-envios"
message_service_sid = "local-sin-envios"
auth_token = "local-sin-envios"

# Números de prueba (solo local): no se envía nada y el código siempre es 123456. Así se prueba el proveedor real sin Twilio.
[auth.sms.test_otp]
50688881234 = "123456"
50687770001 = "123456"
50688889999 = "123456"
50688990001 = "123456"  # admin local (fase 2): el seed lo marca is_admin
14155550100 = "123456"  # número de otro país (EE. UU.) para probar el selector de país; en el alojado no se añade nada
# Casas de prueba (pnpm datos:prueba): tres anfitriones y un cliente que ninguna prueba automática usa ni borra.
50688000001 = "123456"
50688000002 = "123456"
50688000003 = "123456"
50688000004 = "123456"

# Tope de códigos por hora en todo el proyecto (cada envío cuesta dinero; evita el «SMS pumping»).
# En el proyecto alojado se ajusta en Authentication → Rate Limits.
[auth.rate_limit]
sms_sent = 30

# Protección de bots (Turnstile, ticket 11): APAGADA en local a propósito. Encendida, cada código pediría un token que
# GoTrue comprueba con Cloudflare, y las pruebas de base y los arneses no lo mandan. La app manda el token igual (sitekey
# de prueba). Para probarla: [auth.captcha] enabled = true, provider = "turnstile",
# secret = "1x0000000000000000000000000000000AA" y `supabase stop && supabase start`. Alojado: docs/configuracion-supabase.md, paso 9.

# Segundo factor del admin (2026-10-23): app de autenticación (TOTP), disponible en todos los planes de Supabase; el MFA
# por teléfono es solo del plan Pro. Las políticas de admin exigen aal2 en SQL. Clientes y propietarios no lo usan.
# En el proyecto alojado: Authentication → Multi-Factor → App Authenticator (TOTP), Enroll y Verify (activo por defecto).
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

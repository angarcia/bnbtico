<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#59 · Móvil · Buscar con número de noches</title>
<link rel="stylesheet" href="app.css">
<style>
  /* Solo de la maqueta: la fila de atajos. Reutiliza .chip (aria-pressed) y .people-stepper de la app. */
  .nights-quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>
<!-- Maqueta #59 v1 (2026-11-17). Marcado copiado de client/screens/buscar.tsx; cambia solo el segundo bloque:
     «¿Cuándo?» (calendario) → «¿Cuántas noches?» (contador 1–90 y atajos). Estado: 4 noches elegidas. -->
<main class="view no-nav">
<div class="search-screen">
  <h1 class="sr-only">Buscar casas</h1>
  <button type="button" class="icon-btn search-close" aria-label="Cerrar la búsqueda">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>

  <section class="search-closed">
    <div class="search-card-head"><h2>
      <button type="button" class="search-fold" aria-expanded="false"><span>¿Dónde?</span><b class="num">Añadir zona</b>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
    </h2></div>
  </section>

  <section class="search-card">
    <div class="search-card-head"><h2>
      <button type="button" class="search-card-title" aria-expanded="true" aria-controls="noches"><span>¿Cuántas noches?</span></button>
    </h2></div>
    <div class="search-card-body" id="noches">
      <div class="row between">
        <span class="stack gap-0">
          <b>Noches</b>
          <span class="small muted">De 1 a 90</span>
        </span>
        <span class="people-stepper">
          <button type="button" aria-label="Una noche menos">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
          </button>
          <b class="num" aria-live="polite">4</b>
          <button type="button" aria-label="Una noche más">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </span>
      </div>
      <div class="nights-quick" role="group" aria-label="Atajos de noches">
        <button type="button" class="chip" aria-pressed="false">Fin de semana</button>
        <button type="button" class="chip" aria-pressed="false">1 semana</button>
        <button type="button" class="chip" aria-pressed="false">2 semanas</button>
        <button type="button" class="chip" aria-pressed="false">1 mes</button>
      </div>
      <div class="row between" style="margin-top:12px">
        <span class="xs muted">Le mostramos un precio orientativo para esas noches. La disponibilidad se la confirma el anfitrión por WhatsApp.</span>
        <button type="button" class="btn-text">Quitar</button>
      </div>
    </div>
  </section>

  <section class="search-closed">
    <div class="search-card-head"><h2>
      <button type="button" class="search-fold" aria-expanded="false"><span>¿Quiénes?</span><b class="num">2 personas</b>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
    </h2></div>
  </section>

  <div class="sticky-spacer" aria-hidden="true"></div>
  <div class="sticky-actions">
    <button type="button" class="btn-text">Borrar todo</button>
    <button type="button" class="btn btn-primary grow">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Buscar
    </button>
  </div>
</div>
</main>
</body>
</html>

name: app

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  verificar-y-desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/app
    env:
      # main → producción (sin ruta todavía); develop y pull requests → pruebas (nueva.bnbtico.com).
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'pruebas' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm typecheck
      - name: Pruebas unitarias
        run: pnpm test
      - name: Supabase local (Docker del runner)
        working-directory: .
        run: pnpm exec supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime
      - name: Tipos de la base al día con las migraciones
        run: |
          pnpm db:types
          git diff --exit-code -- src/domain/database.types.ts || { echo "::error::database.types.ts no coincide con las migraciones: ejecute pnpm --filter app db:types y confirme el resultado."; exit 1; }
      - name: Pruebas de base (contrato contra PostgREST)
        run: pnpm test:db
      - name: Build local para las pruebas de navegador (contra Supabase local)
        run: |
          pnpm dev:vars
          pnpm build
      - name: Navegador de Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Ficha real, hidratación y shell (Pixel 7)
        run: pnpm test:e2e
      - name: Build para desplegar (navegador y worker)
        env:
          CLOUDFLARE_ENV: ${{ env.DEPLOY_ENV }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          # Números de atención por WhatsApp (Ayuda); sin ellos el botón sale deshabilitado.
          VITE_WA_OWNERS: ${{ vars.WA_OWNERS }}
          VITE_WA_GUESTS: ${{ vars.WA_GUESTS }}
        run: |
          rm -f .dev.vars .env.local
          test -n "$VITE_SUPABASE_URL" -a -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::Faltan SUPABASE_URL o SUPABASE_ANON_KEY en GitHub (variables o secretos)."; exit 1; }
          pnpm build
      - name: Puerta de tamaño (zona privada < 150 KB gz)
        run: pnpm size

      - name: Secretos del worker
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          PURGE_SECRET: ${{ secrets.PURGE_SECRET }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
        # Los que aún no existan en GitHub no se suben (la purga responde 503 hasta tenerlos).
        run: |
          jq -n 'env | {SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ANON_KEY, PURGE_SECRET, CF_ZONE_ID, CF_PURGE_TOKEN} | with_entries(select(.value != null and .value != ""))' > "$RUNNER_TEMP/worker-secrets.json"

      - name: Desplegar
        id: deploy
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/app
          packageManager: pnpm
          wranglerVersion: "4.152.0"
          command: deploy --secrets-file ${{ runner.temp }}/worker-secrets.json --message "${{ github.sha }}"

      - name: Versión de vista previa
        id: preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/app
          packageManager: pnpm
          wranglerVersion: "4.152.0"
          command: versions upload --preview-alias pr-${{ github.event.number }} --secrets-file ${{ runner.temp }}/worker-secrets.json --message "${{ github.sha }}"

      - name: Publicar la URL de vista previa en el pull request
        if: steps.preview.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ steps.preview.outputs.command-output }}
          URL: ${{ steps.preview.outputs.deployment-url }}
        run: |
          alias_url=$(printf '%s' "$OUTPUT" | grep -oE 'https://pr-[a-z0-9-]+\.[a-z0-9.-]+\.workers\.dev' | head -1)
          gh pr comment ${{ github.event.number }} --edit-last --create-if-none --body "Vista previa de \`${{ github.sha }}\`: ${alias_url:-$URL}"

      - name: Borrar los secretos del disco
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
